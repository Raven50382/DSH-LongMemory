<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xliens 控制台</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #d7dce5; --dim: #8b93a3; --accent: #5b9dff;
    --good: #3ecf8e; --warn: #ffb454; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
    color: var(--dim); user-select: none;
  }
  .tab.on { background: #232936; color: var(--text); }
  .spacer { flex: 1; }
  .stat { color: var(--dim); font-size: 12px; }
  main { padding: 14px 16px 40px; }
  .page { display: none; }
  .page.on { display: block; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .muted { color: var(--dim); }
  canvas { width: 100%; display: block; border-radius: 8px; background: #12151b; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    background: #232936; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #08111f; border-color: var(--accent); font-weight: 600; }
  textarea, input {
    background: #12151b; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; font: inherit; width: 100%;
  }
  textarea { min-height: 84px; resize: vertical; font-family: ui-monospace, Consolas, monospace; }
  .step {
    border-left: 2px solid var(--line); padding: 3px 0 3px 12px; margin: 3px 0;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  }
  .step.move { border-left-color: var(--accent); }
  .step.stop { border-left-color: var(--warn); }
  .step.best { border-left-color: var(--good); }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-size: 11px; background: #232936; color: var(--dim); margin-right: 6px;
  }
  .badge.high { background: #14392a; color: var(--good); }
  .badge.medium { background: #3a2f16; color: var(--warn); }
  .badge.low { background: #3a1a1a; color: var(--bad); }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 12px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Xliens</h1>
  <div class="tabs">
    <div class="tab on" data-page="graph">逻辑图</div>
    <div class="tab" data-page="trace">章动过程</div>
    <div class="tab" data-page="allow">白名单</div>
  </div>
  <div class="spacer"></div>
  <div class="stat" id="stat">加载中…</div>
</header>

<main>
  <section class="page on" id="page-graph">
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <h3 style="margin:0">逻辑关联图</h3>
        <span class="muted">点节点看详情 · 边越亮关联越强</span>
        <div class="spacer"></div>
        <label class="muted"><input type="checkbox" id="showLabels" checked style="width:auto"> 显示文字</label>
        <button id="relayout">重新布局</button>
      </div>
      <canvas id="cv" height="620"></canvas>
    </div>
    <div class="card" id="nodeDetail" style="display:none">
      <h3>节点详情</h3>
      <div class="kv" id="nodeKv"></div>
    </div>
  </section>

  <section class="page" id="page-trace">
    <div class="card">
      <div class="row">
        <h3 style="margin:0">最近一次章动</h3>
        <div class="spacer"></div>
        <button id="refreshTrace">刷新</button>
      </div>
      <div id="traceBody" class="muted" style="margin-top:8px">还没有召回记录。在 QQ 里问一句需要回忆的话就会出现在这里。</div>
    </div>
  </section>

  <section class="page" id="page-allow">
    <div class="card">
      <h3>放行白名单</h3>
      <p class="muted" style="margin-top:0">
        默认全不放行。每行一个 ID。改动立即生效，不需要重启。
      </p>
      <div style="margin-bottom:10px">
        <div class="muted" style="margin-bottom:4px">允许的群号</div>
        <textarea id="allowGroups" placeholder="123456789&#10;987654321"></textarea>
      </div>
      <div style="margin-bottom:10px">
        <div class="muted" style="margin-bottom:4px">允许的私聊 QQ 号</div>
        <textarea id="allowPrivate" placeholder="10001"></textarea>
      </div>
      <div style="margin-bottom:10px">
        <div class="muted" style="margin-bottom:4px">黑名单（这些人的消息一律不理）</div>
        <textarea id="denyUsers" placeholder="（一般留空）"></textarea>
      </div>
      <div class="row">
        <button class="primary" id="saveAllow">保存</button>
        <span class="muted" id="allowMsg"></span>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const api = (p) => fetch(p).then(r => r.json());
const post = (p, b) => fetch(p, {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(b),
}).then(r => r.json());

// ---------- 标签切换 ----------
let current = 'graph';
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    document.querySelectorAll('.page').forEach(x =>
      x.classList.toggle('on', x.id === 'page-' + t.dataset.page));
    current = t.dataset.page;
    if (current === 'trace') loadTrace();
    if (current === 'allow') loadAllow();
    if (current === 'graph') draw();
  };
});

// ---------- 图 ----------
let G = { nodes: [], edges: [] };
const pos = new Map();
let hi = new Set();      // 高亮的节点（最近一次召回的中心+邻居）
let hiCenter = null;
let dragging = null, hover = null;

function layout(iter = 260) {
  const W = $('#cv').clientWidth || 900, H = 620;
  const n = G.nodes.length;
  const cx = W / 2, cy = H / 2;
  G.nodes.forEach((nd, i) => {
    const a = (i / Math.max(1, n)) * Math.PI * 2;
    const r = Math.min(W, H) * 0.36;
    pos.set(nd.id, { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: 0, vy: 0 });
  });
  // 简单力导向
  const byId = new Map(G.nodes.map(d => [d.id, d]));
  for (let it = 0; it < iter; it++) {
    const k = 1 - it / iter;
    // 斥力
    for (let i = 0; i < n; i++) {
      const a = pos.get(G.nodes[i].id);
      for (let j = i + 1; j < n; j++) {
        const b = pos.get(G.nodes[j].id);
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy || 0.01;
        const f = 900 / d2;
        const d = Math.sqrt(d2);
        dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f;
        b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    // 引力（边）
    for (const e of G.edges) {
      const a = pos.get(e.source), b = pos.get(e.target);
      if (!a || !b) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - 90) * 0.012 * (e.score || 0.3);
      dx /= d; dy /= d;
      a.vx += dx * f; a.vy += dy * f;
      b.vx -= dx * f; b.vy -= dy * f;
    }
    // 向心 + 应用
    for (const nd of G.nodes) {
      const p = pos.get(nd.id);
      p.vx += (cx - p.x) * 0.0016;
      p.vy += (cy - p.y) * 0.0016;
      p.x += p.vx * k * 0.6;
      p.y += p.vy * k * 0.6;
      p.vx *= 0.82; p.vy *= 0.82;
      p.x = Math.max(30, Math.min(W - 30, p.x));
      p.y = Math.max(24, Math.min(H - 24, p.y));
    }
  }
}

function draw() {
  const cv = $('#cv');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 900, H = 620;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const showLabels = $('#showLabels').checked;

  // 边
  for (const e of G.edges) {
    const a = pos.get(e.source), b = pos.get(e.target);
    if (!a || !b) continue;
    const s = e.score || 0;
    const active = hi.has(e.source) && hi.has(e.target);
    g.strokeStyle = active
      ? `rgba(91,157,255,${0.25 + s * 0.7})`
      : `rgba(140,150,170,${0.06 + s * 0.22})`;
    g.lineWidth = active ? 1 + s * 2.2 : 0.6 + s * 1.1;
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
  }

  // 节点
  const times = G.nodes.map(d => d.time).filter(Boolean).sort();
  const t0 = times[0] || '', t1 = times[times.length - 1] || '';
  for (const nd of G.nodes) {
    const p = pos.get(nd.id);
    if (!p) continue;
    const isCenter = nd.id === hiCenter;
    const active = hi.has(nd.id);
    const r = 4 + Math.min(6, (nd.degree || 0) * 0.8) + (isCenter ? 4 : 0);
    let fill = '#4a5568';
    if (active) fill = isCenter ? '#ffd479' : '#5b9dff';
    if (hover === nd.id) fill = '#ffffff';
    g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2);
    g.fillStyle = fill; g.fill();
    if (isCenter) { g.strokeStyle = '#ffd479'; g.lineWidth = 2; g.stroke(); }
    if (showLabels) {
      g.fillStyle = active ? '#d7dce5' : 'rgba(150,160,180,.75)';
      g.font = '11px sans-serif';
      g.fillText(nd.desc.slice(0, 18), p.x + r + 3, p.y + 4);
    }
  }
  $('#stat').textContent = `${G.nodes.length} 节点 / ${G.edges.length} 边` +
    (t0 ? ` · ${t0.slice(5, 10)} ~ ${t1.slice(5, 10)}` : '');
}

$('#relayout').onclick = () => { layout(); draw(); };
$('#showLabels').onchange = draw;

$('#cv').addEventListener('mousemove', (ev) => {
  const r = ev.target.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  if (dragging !== null) {
    const p = pos.get(dragging); p.x = mx; p.y = my; draw(); return;
  }
  hover = null;
  for (const nd of G.nodes) {
    const p = pos.get(nd.id);
    if (!p) continue;
    if ((p.x - mx) ** 2 + (p.y - my) ** 2 < 90) { hover = nd.id; break; }
  }
  $('#cv').style.cursor = hover !== null ? 'pointer' : 'default';
});

$('#cv').addEventListener('mousedown', (ev) => {
  const r = ev.target.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  for (const nd of G.nodes) {
    const p = pos.get(nd.id);
    if (!p) continue;
    if ((p.x - mx) ** 2 + (p.y - my) ** 2 < 90) { dragging = nd.id; return; }
  }
});
window.addEventListener('mouseup', () => { dragging = null; });

$('#cv').addEventListener('click', (ev) => {
  if (dragging !== null) return;
  const r = ev.target.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  for (const nd of G.nodes) {
    const p = pos.get(nd.id);
    if (!p) continue;
    if ((p.x - mx) ** 2 + (p.y - my) ** 2 < 90) { showNode(nd); return; }
  }
});

function showNode(nd) {
  const box = $('#nodeDetail');
  box.style.display = 'block';
  $('#nodeKv').innerHTML = `
    <dt>事件</dt><dd>${esc(nd.desc)}</dd>
    <dt>时间</dt><dd>${esc(nd.time || '—')}</dd>
    <dt>主体</dt><dd>${esc(nd.subject || '—')}</dd>
    <dt>客体</dt><dd>${esc(nd.object || '—')}</dd>
    <dt>关联边</dt><dd>${nd.degree} 条</dd>
    <dt>编号</dt><dd>#${nd.id}</dd>`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function loadGraph() {
  G = await api('/api/graph');
  layout(); draw();
}

// ---------- 章动 ----------
async function loadTrace() {
  const d = await api('/api/trace');
  const list = d.traces || [];
  const box = $('#traceBody');
  if (!list.length) {
    box.className = 'muted';
    box.textContent = '还没有召回记录。在 QQ 里问一句需要回忆的话就会出现在这里。';
    return;
  }
  box.className = '';
  const t = list[list.length - 1];   // 最近一次
  hi = new Set();
  if (t.center) hi.add(t.center.id);
  (t.neighbors || []).forEach(n => hi.add(n.id));
  hiCenter = t.center ? t.center.id : null;
  if (current === 'graph') draw();

  const kindName = { filter: '筛选', entry: '入口', score: '打分', move: '跳步',
                     stop: '停止', entry_end: '入口结束', best: '最佳' };
  let html = `
    <div class="row" style="margin-bottom:10px">
      <span class="badge ${t.confidence || ''}">${t.confidence || '—'}</span>
      <b>${esc(t.query)}</b>
      <span class="muted">${t.at} · 切分 ${t.ms_seg ?? '?'}ms · 召回 ${t.ms_recall ?? '?'}ms</span>
    </div>
    <div class="muted" style="margin-bottom:8px">切出 EU：${(t.eus || []).map(esc).join(' / ') || '（无）'}</div>`;

  if (t.center) {
    html += `<div class="card" style="background:#12151b">
      <div><span class="badge">中心</span><b>${esc(t.center.desc)}</b>
        <span class="muted">${esc(t.center.time || '')} · 分数 ${t.center.score}</span></div>
      <div class="muted" style="margin-top:4px">主体 ${esc(t.center.subject || '—')} → 客体 ${esc(t.center.object || '—')}</div>
    </div>`;
  }

  for (const run of (t.runs || [])) {
    html += `<div class="card" style="background:#12151b">
      <div class="muted" style="margin-bottom:6px">EU：${esc(run.eu)}</div>`;
    for (const st of (run.trace || [])) {
      const cls = ['move', 'stop', 'best'].includes(st.kind) ? st.kind : '';
      html += `<div class="step ${cls}">
        <span class="badge">${kindName[st.kind] || st.kind}</span>${esc(st.text || '')}</div>`;
    }
    if ((run.bests || []).length) {
      html += `<div class="muted" style="margin-top:6px">Best：` +
        run.bests.map(b => `#${b.id}(${b.score})`).join('、') + '</div>';
    }
    html += '</div>';
  }

  if ((t.neighbors || []).length) {
    html += `<div class="card" style="background:#12151b"><div class="muted">邻居</div>`;
    for (const n of t.neighbors) {
      html += `<div class="step move">${n.hops} 跳 · ${n.score} · ${esc(n.desc)}</div>`;
    }
    html += '</div>';
  }

  box.innerHTML = html;
}

// ---------- 白名单 ----------
async function loadAllow() {
  const a = await api('/api/allow');
  $('#allowGroups').value = (a.groups || []).join('\n');
  $('#allowPrivate').value = (a.private || []).join('\n');
  $('#denyUsers').value = (a.denyUsers || []).join('\n');
  $('#allowMsg').textContent = '';
}

const lines = (s) => s.split(/\r?\n/).map(x => x.trim()).filter(Boolean);

$('#saveAllow').onclick = async () => {
  const body = {
    groups: lines($('#allowGroups').value),
    private: lines($('#allowPrivate').value),
    denyUsers: lines($('#denyUsers').value),
  };
  try {
    const r = await post('/api/allow', body);
    $('#allowMsg').textContent =
      `已保存：${(r.groups || []).length} 个群、${(r.private || []).length} 个私聊`;
  } catch (e) {
    $('#allowMsg').textContent = '保存失败：' + e;
  }
};

$('#refreshTrace').onclick = loadTrace;

// ---------- 启动 ----------
loadGraph();
setInterval(() => {
  if (current === 'trace') loadTrace();
}, 5000);
</script>
</body>
</html>
